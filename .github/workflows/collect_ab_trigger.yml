name: Trigger Scanner A + B Recovery

on:
  push:
    branches:
      - main
    paths:
      - "data/collect_ab_trigger.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Collect Scanner A + B
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect_ab.yml --repo "${{ github.repository }}" --ref main
