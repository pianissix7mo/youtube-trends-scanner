name: Enrich Selected Entities

on:
  push:
    paths:
      - "data/selected_entities.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-selected-entities
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube metrics cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: youtube-metrics-${{ github.run_id }}
          restore-keys: |
            youtube-metrics-

      - name: Validate enrichment stage
        run: |
          python -m py_compile youtube_enrich.py
          python -m json.tool data/selected_entities.json > /dev/null

      - name: Run YouTube enrichment
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CACHE_TTL_HOURS: "12"
          YOUTUBE_STALE_FALLBACK_HOURS: "48"
        run: python youtube_enrich.py

      - name: Add measurement table to summary
        if: always()
        run: |
          if [ -f output/latest.md ]; then
            cat output/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit latest enrichment output
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest.json output/latest.md
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Update YouTube entity enrichment"
          git push

      - name: Upload enrichment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-entity-enrichment
          path: output/
          if-no-files-found: warn
