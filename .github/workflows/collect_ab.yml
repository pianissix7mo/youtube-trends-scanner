name: Collect Scanner A + B

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Scanner A Google Trends YouTube Search timeframe
        required: false
        default: "now 3-d"
      raw_limit:
        description: Scanner A maximum raw candidates for review
        required: false
        default: "1000"
  schedule:
    # Toronto 02:15 = 06:15 UTC in EDT, 07:15 UTC in EST.
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

permissions:
  contents: write

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Check Toronto schedule
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TORONTO_OFFSET=$(TZ=America/Toronto date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          if { [ "$TORONTO_OFFSET" = "-0400" ] && [ "$SCHEDULE" = "15 6 * * *" ]; } || \
             { [ "$TORONTO_OFFSET" = "-0500" ] && [ "$SCHEDULE" = "15 7 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger."
          fi

  scanner_a:
    name: Scanner A - Raw Trends
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Google Trends Explore cache
        uses: actions/cache@v4
        with:
          path: .cache/trendspyg
          key: trendspyg-explore-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trendspyg-explore-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Use fixed four-anchor set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('collect_trends.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('["stock market", "AI", "semiconductor", "earnings", "bitcoin", "stocks"]', '["AI", "semiconductor", "earnings", "stocks"]')
          s = s.replace('["美股", "AI", "半導體", "財報", "比特幣", "股票"]', '["AI", "半導體", "財報", "股票"]')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Scanner A collector
        run: python -m py_compile collect_trends.py make_review_file.py

      - name: Collect Scanner A raw trends
        env:
          TRENDS_TIMEFRAME: ${{ github.event.inputs.timeframe || 'now 3-d' }}
          RAW_LIMIT: ${{ github.event.inputs.raw_limit || '1000' }}
          TRENDING_RSS_HOURS: "48"
          YT_TRENDS_ANCHORS_PER_REGION: "4"
          YT_TRENDS_DELAY_SECONDS: "12"
          YT_TRENDS_BATCH_SIZE: "6"
          YT_TRENDS_BATCH_PAUSE_SECONDS: "120"
          YT_TRENDS_CACHE_TTL_SECONDS: "86400"
          TRENDSPYG_DB: ".cache/trendspyg/trendspyg.db"
          TRENDSPYG_COOKIES: ".cache/trendspyg/explore_cookies.json"
        run: |
          python collect_trends.py
          python make_review_file.py

      - name: Commit Scanner A discovery state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_candidates.json data/raw_review.jsonl
          if git diff --cached --quiet; then
            echo "No Scanner A discovery changes to commit."
            exit 0
          fi
          git commit -m "Update Scanner A raw trend candidates"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push race detected; retrying ($attempt/3)..."
            sleep 5
          done
          exit 1

      - name: Upload Scanner A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-a-discovery-latest
          path: |
            data/raw_candidates.json
            data/raw_review.jsonl
          if-no-files-found: warn
          retention-days: 14

  scanner_b:
    name: Scanner B - Catalyst Discovery
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner_b/requirements.txt

      - name: Install dependencies
        run: pip install -r scanner_b/requirements.txt

      - name: Validate Scanner B
        working-directory: scanner_b
        run: python -m py_compile scanner_common.py collect_external.py collect_external_safe.py news_rss.py collect_rss.py clean_events.py rank_candidates.py rank_rss.py rank_for_judge.py make_judge_review.py youtube_enrich.py

      - name: Collect external catalysts
        working-directory: scanner_b
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'youtube-trends-scanner/scanner-b 70549770+pianissix7mo@users.noreply.github.com' }}
        run: python collect_rss.py

      - name: Clean and prepare Judge B candidates
        working-directory: scanner_b
        run: |
          python clean_events.py
          python rank_for_judge.py
          python make_judge_review.py

      - name: Commit Scanner B discovery state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_b/data/raw_events.json scanner_b/data/judge_candidates.json scanner_b/data/judge_review.jsonl scanner_b/data/baseline_history.json
          if git diff --cached --quiet; then
            echo "No Scanner B discovery changes to commit."
            exit 0
          fi
          git commit -m "Update Scanner B discovery candidates"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push race detected; retrying ($attempt/3)..."
            sleep 5
          done
          exit 1

      - name: Upload Scanner B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-b-discovery-latest
          path: |
            scanner_b/data/raw_events.json
            scanner_b/data/judge_candidates.json
            scanner_b/data/judge_review.jsonl
            scanner_b/data/baseline_history.json
          if-no-files-found: warn
          retention-days: 14
