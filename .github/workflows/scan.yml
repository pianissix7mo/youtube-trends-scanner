name: YouTube Trend Scan

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: Number of final keywords
        required: false
        default: "40"
      timeframe:
        description: Google Trends YouTube Search timeframe
        required: false
        default: "now 7-d"
  schedule:
    # 12:00 UTC = 20:00 Taiwan; 08:00 Toronto during EDT (07:00 during EST).
    - cron: "0 12 * * *"

concurrency:
  group: youtube-trend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scanner
        run: |
          python -m py_compile scan.py hybrid_scan.py
          python -m json.tool keywords.json > /dev/null

      - name: Run hybrid scanner
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TOP_N: ${{ github.event.inputs.top_n || '40' }}
          TRENDS_TIMEFRAME: ${{ github.event.inputs.timeframe || 'now 7-d' }}
          DISCOVERY_ANCHORS: "5"
          TREND_BENCHMARK_GROUPS: "3"
          TRENDS_MAX_ATTEMPTS: "1"
          TRENDS_RETRY_WAIT: "5"
          # Cheap broad-net layer. Five feeds are fetched in parallel, so this
          # adds coverage without materially increasing total runtime.
          TRENDING_RSS_GEOS: "US,CA,TW,HK,SG"
          TRENDING_RSS_HOURS: "48"
          TRENDING_RSS_TIMEOUT: "10"
          TRENDING_RSS_PER_GEO: "50"
          TRENDING_PRESELECT_LIMIT: "16"
        run: python hybrid_scan.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f output/latest.md ]; then
            cat output/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trend-report
          path: output/
          if-no-files-found: warn
