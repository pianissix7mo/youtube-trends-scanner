name: Trigger Scanner A + B Recovery

on:
  workflow_dispatch:

# Automatic recovery trigger paused 2026-10-10 at owner's request; manual dispatch remains available.
permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Collect Scanner A + B
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect_ab.yml --repo "${{ github.repository }}" --ref main
