name: Collect Raw Trends

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Google Trends YouTube Search timeframe
        required: false
        default: "now 7-d"
      raw_limit:
        description: Maximum raw candidates written for ChatGPT review
        required: false
        default: "1000"
  schedule:
    # Toronto 05:00 = 09:00 UTC in EDT, 10:00 UTC in EST.
    # Trigger both, then gate using America/Toronto so DST stays correct.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: collect-raw-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Toronto schedule
        id: toronto_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TORONTO_HOUR=$(TZ=America/Toronto date +%H)
          echo "Toronto hour: $TORONTO_HOUR"
          if [ "$TORONTO_HOUR" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger."
          fi

      - uses: actions/checkout@v4
        if: steps.toronto_time.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.toronto_time.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.toronto_time.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Validate collector
        if: steps.toronto_time.outputs.run == 'true'
        run: python -m py_compile collect_trends.py

      - name: Collect US CA TW raw trends
        if: steps.toronto_time.outputs.run == 'true'
        env:
          TRENDS_TIMEFRAME: ${{ github.event.inputs.timeframe || 'now 7-d' }}
          RAW_LIMIT: ${{ github.event.inputs.raw_limit || '1000' }}
          TRENDING_RSS_HOURS: "48"
        run: python collect_trends.py

      - name: Show collection summary
        if: steps.toronto_time.outputs.run == 'true' && always()
        shell: bash
        run: |
          if [ -f data/raw_candidates.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/raw_candidates.json').read_text(encoding='utf-8'))
          print(f"Raw candidates: {d.get('candidate_count')}")
          print(f"Rows before dedupe: {d.get('row_count_before_dedupe')}")
          print(f"Region counts: {d.get('candidate_region_counts')}")
          print(f"Errors: {len(d.get('errors') or [])}")
          PY
          fi

      - name: Commit raw candidates
        if: steps.toronto_time.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_candidates.json
          if git diff --cached --quiet; then
            echo "No raw candidate changes to commit."
            exit 0
          fi
          git commit -m "Update daily raw trend candidates"
          git push

      - name: Upload raw candidate artifact
        if: steps.toronto_time.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-trend-candidates
          path: data/raw_candidates.json
          if-no-files-found: warn
